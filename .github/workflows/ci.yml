name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests and coverage
        run: >
          pytest
          --cov=vait
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Benchmark smoke checks
        run: |
          python examples/evaluate_ap_benchmark.py
          python examples/verify_ap_benchmark.py
          python examples/check_ap_benchmark_quality.py
          python examples/check_ap_benchmark_v02_quality.py
