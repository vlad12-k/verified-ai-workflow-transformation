name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: >
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          "torch==2.14.0+cpu"

      - name: Install project
        run: python -m pip install -e ".[dev,ml,tensorflow,embeddings,slm,peft]"

      - name: Verify CPU PyTorch
        run: >
          python -c
          "import torch;
          print('torch:', torch.__version__);
          print('cuda:', torch.version.cuda);
          assert torch.version.cuda is None"

      - name: Compile Python
        run: python -m compileall -q src tests examples

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests examples

      - name: Tests and coverage
        run: >
          pytest
          --cov=vait
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Benchmark smoke checks
        run: |
          python examples/evaluate_ap_benchmark.py
          python examples/verify_ap_benchmark.py
          python examples/check_ap_benchmark_quality.py
          python examples/check_ap_benchmark_v02_quality.py
          python examples/verify_ap_transformation_v02.py
          python examples/assess_ap_transformations_v02.py
          python examples/verify_ap_ml_candidates_v02.py
          python examples/verify_ap_torch_candidate_v02.py
          python examples/evaluate_ap_cost_performance_v01.py

      - name: M4 optimisation smoke checks
        run: |
          python examples/analyse_m4i_multi_objective_v01.py
          python examples/build_m4j_recommendation_plan_v01.py
