[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-ai-workflow-transformation"
version = "0.1.0"
description = "A verification engine for evaluating AI workflow transformations under behavioural, risk, latency, and cost constraints."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Vladyslav Kononov" }
]
dependencies = [
    "pydantic>=2.9,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.8,<15.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0",
    "scipy-stubs"
]

ml = [
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
]

torch = [
    "torch>=2.5,<3.0",
]

torchao = [
    "torchao==0.18.0",
]

tensorflow = [
    "tensorflow==2.21.0",
]

embeddings = [
    "sentence-transformers>=6.0,<7.0",
]

slm = [
    "transformers>=5.17,<6.0",
]

peft = [
    "peft>=0.17,<1.0",
]

qlora = [
    "bitsandbytes==0.50.2",
]

[project.scripts]
vait = "vait.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vait = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vait"]

[tool.coverage.run]
source = ["vait"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "xgboost.*",
    "sentence_transformers.*",
    "keras.*",
    "torchao.*",
]
ignore_missing_imports = true
